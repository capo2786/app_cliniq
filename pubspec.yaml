name: app_cliniq
description: "Cliniq: la aplicación del paciente para agendar y seguir sus citas."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Estado y red
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.0.8
  dio: ^5.9.2

  # Almacenamiento
  flutter_secure_storage: ^10.3.1
  hive_ce_flutter: ^2.3.4

  # Dispositivo y seguridad
  local_auth: ^3.0.1
  package_info_plus: ^10.1.0
  url_launcher: ^6.3.2
  # Los enlaces de los correos (confirmar el correo, crear la contraseña
  # nueva) abren la aplicación: App Links y Universal Links (ver «Enlaces de
  # los correos» en el README).
  app_links: ^7.2.1

  # El logotipo de la clínica (su dirección en la configuración; de un
  # servidor anterior, un data URL) puede ser SVG además de PNG o JPG.
  flutter_svg: ^2.3.0

  # Fechas y recordatorios. La versión de flutter_local_notifications importa:
  # es la misma que usa UCEBell y la que ya se sabe que compila con este SDK.
  intl: ^0.20.2
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.0
  image_picker: ^1.2.3
  file_selector: ^1.1.0
  open_filex: ^4.7.0
  path_provider: ^2.1.6

  # La videoconsulta dentro de la aplicación: la sala de Jitsi de la clínica
  # en un WebView propio, bajo la cabecera de Cliniq, sin navegador ni
  # actividad aparte. permission_handler pide la cámara y el micrófono antes
  # de abrirla (ver «Videoconsulta» y «Configuración nativa» en el README).
  flutter_inappwebview: ^6.1.5
  permission_handler: ^13.0.2

  # Las recetas, las órdenes y los certificados en PDF, dentro de la
  # aplicación: pdfx los pinta con el lector del propio sistema (nunca otra
  # aplicación ni el navegador), flutter_file_dialog abre el diálogo del
  # sistema para «Guardar en el teléfono», share_plus la hoja de «Compartir»
  # y crypto calcula la huella sha256 con que se guarda y se comprueba cada
  # copia (ver «Recetas, órdenes y certificados» en el README).
  pdfx: ^2.11.0
  flutter_file_dialog: ^3.3.3
  share_plus: ^13.3.0
  crypto: ^3.0.7

  # Mediciones del paciente y el escáner experimental de signos vitales
  # (ver «Mis signos vitales» y «Escáner experimental» en el README). La
  # cámara entrega los cuadros y enciende el flash; ML Kit encuentra el
  # rostro en el propio teléfono (modelo incluido, sin red); fftea es la FFT
  # (Dart puro) del procesamiento de la señal; fl_chart dibuja la evolución.
  camera: ^0.12.1
  google_mlkit_face_detection: ^0.15.1
  fftea: ^1.5.0+1
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  # Sin recursos empaquetados: el logotipo de marca se dibuja con código
  # (PintorLogoCliniq) y los PNG de assets/images solo sirven para generar el
  # icono y el arranque nativos. El logotipo de cada clínica llega de la
  # configuración pública (`clinica.logo`).

# Icono de la aplicación.
#
# Los PNG salen del mismo `PintorLogoCliniq` que dibuja el logotipo en la
# aplicación (ver tool/generar_iconos_test.dart). Tras cambiar el logotipo:
#   flutter test tool/generar_iconos_test.dart
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icono_app.png"
  # iOS no admite transparencia en el icono: el PNG ya viene con fondo.
  remove_alpha_ios: true
  # Android 8+: icono adaptable, con el logotipo en la zona segura.
  adaptive_icon_background: "#F4EFEA"
  adaptive_icon_foreground: "assets/images/icono_primer_plano.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/icono_app.png"
    background_color: "#0F171A"
    theme_color: "#5A6E73"

# Pantalla de arranque.
#
# El mismo fondo profundo de la aplicación, para que el paso a la pantalla de
# arranque de Flutter no se note, y la misma pastilla clara del logotipo que
# se ve en el acceso. Tras cambiar algo de aquí:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B1113"
  image: "assets/images/splash_logo.png"
  color_dark: "#0B1113"
  image_dark: "assets/images/splash_logo.png"

  android_12:
    # Android 12+ recorta el icono a un círculo sobre este fondo: va el
    # logotipo solo, sobre el claro cálido del icono.
    image: "assets/images/splash_android12.png"
    icon_background_color: "#F4EFEA"
    color: "#0B1113"
    image_dark: "assets/images/splash_android12.png"
    icon_background_color_dark: "#F4EFEA"
    color_dark: "#0B1113"

  android: true
  ios: true
  web: true
